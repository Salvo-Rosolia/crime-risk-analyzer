name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # On pushes the PR number is empty: falling back to the sha keeps pushes to main from cancelling each other.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Quality checks
        run: uv run python scripts/check.py
      - name: Dependency audit (pip-audit)
        # Exports the locked dependency set (uv.lock) and passes it to pip-audit.
        # Fails the lane if a known vulnerability shows up (none today).
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect frontend tooling
        id: tooling
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "package.json found: running lint + type-check + tests."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend tooling yet (no package.json): skip-pass."
          fi
      - name: Setup Node
        if: ${{ steps.tooling.outputs.present == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "frontend/.nvmrc"
      - name: Install dependencies
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm ci
      - name: Dependency audit (npm audit)
        # Fails only on high/critical vulnerabilities in production (devDependencies excluded from the audit); low ones stay informational.
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm run lint
      - name: Type-check specs (Jest and Playwright do not check types)
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm run typecheck:spec
      - name: Tests (with coverage + threshold)
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm run test:coverage

  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect frontend tooling
        id: tooling
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "package.json found: running build + format check."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend tooling yet (no package.json): skip-pass."
          fi
      - name: Setup Node
        if: ${{ steps.tooling.outputs.present == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "frontend/.nvmrc"
      - name: Install dependencies
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm ci
      - name: Build (ng build, production configuration)
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm run build
      - name: Format check (prettier)
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm run format:check

  frontend-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect frontend tooling
        id: tooling
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "package.json found: running the Playwright E2E."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend tooling yet (no package.json): skip-pass."
          fi
      - name: Setup Node
        if: ${{ steps.tooling.outputs.present == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "frontend/.nvmrc"
      - name: Install dependencies
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm ci
      - name: Install Playwright browser (chromium)
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, production build + static server + chromium)
        # `npm run e2e` starts the Playwright webServer (ng build + http-server on
        # :4310, E2E_PORT) and runs the specs; it never reuses existing servers.
        if: ${{ steps.tooling.outputs.present == 'true' }}
        run: npm run e2e
      - name: Upload Playwright report (only on E2E failure)
        # playwright.config produces an HTML report + trace (on-first-retry) in CI; here we
        # upload them as an artifact ONLY if the E2E fail, for post-mortem debugging
        # (downloadable from the run). On failure only, so green runs do not bloat storage.
        # NB: the paths are relative to the repo root (github.workspace), NOT to the job's
        # 'frontend' working-directory (which only applies to run: steps).
        if: ${{ failure() && steps.tooling.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  ci-gate:
    needs: [changes, backend, frontend, frontend-build, frontend-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify lane results
        run: |
          changes_result="${{ needs.changes.result }}"
          backend_result="${{ needs.backend.result }}"
          frontend_result="${{ needs.frontend.result }}"
          frontend_build_result="${{ needs['frontend-build'].result }}"
          frontend_e2e_result="${{ needs['frontend-e2e'].result }}"
          echo "changes        = $changes_result"
          echo "backend        = $backend_result"
          echo "frontend       = $frontend_result"
          echo "frontend-build = $frontend_build_result"
          echo "frontend-e2e   = $frontend_e2e_result"
          for r in "$changes_result" "$backend_result" "$frontend_result" "$frontend_build_result" "$frontend_e2e_result"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job did not pass ($r). Gate RED."
              exit 1
            fi
          done
          echo "All jobs are success or skipped. Gate GREEN."
