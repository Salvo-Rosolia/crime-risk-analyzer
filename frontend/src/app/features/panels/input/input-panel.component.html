<h2 class="cra-eyebrow">Analisi zona</h2>
<p class="cra-hint">Disegna un cerchio sulla mappa (clic per il centro, poi ancora un clic per confermare il raggio).</p>

<form (submit)="onSubmit($event)">
  <div class="cra-field">
    <label for="cra-domanda">
      Domanda <span class="cra-optional">(opzionale · linguaggio naturale)</span>
    </label>
    <textarea
      id="cra-domanda"
      placeholder="es. Quali rischi di sera?"
      [value]="domanda()"
      (input)="onDomandaInput($event)"
    ></textarea>
  </div>

  @if (serverError(); as msg) {
    <p class="cra-input-error" role="alert">{{ msg }}</p>
  }

  <button type="submit" class="cra-btn-solid" [disabled]="!circle()">Analizza zona →</button>
</form>
